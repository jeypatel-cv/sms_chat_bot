services:
  - type: web
    name: vp-realty-sms-pilot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python production_app.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: HOST
        value: 0.0.0.0
      - key: GOOGLE_SHEET_TAB
        value: Properties
      - key: MESSAGE_LOG_TO_CONSOLE
        value: "true"
      - key: MESSAGE_LOG_TO_APPS_SCRIPT
        value: "true"
      - key: MESSAGE_LOG_APPS_SCRIPT_URL
        sync: false
      - key: MESSAGE_LOG_APPS_SCRIPT_SECRET
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: TWILIO_VALIDATE_REQUESTS
        value: "true"
      - key: TWILIO_ALLOW_MOCK
        value: "false"
